<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shuhai Art Studio · Admin</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --peach:#FFB785; --peach-deep:#FFA769; --ink:#1f1f1f; --bg:#FFF7F0; --border:#ecdfd1; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;font-family:'Montserrat',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;}
  h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:600;margin:0;}
  a{color:var(--ink);text-decoration:underline;text-underline-offset:3px;}
  button{font-family:inherit;cursor:pointer;}

  /* Layout */
  .app{display:grid;grid-template-columns:240px 1fr;min-height:100vh;}
  .sidebar{background:#fff;border-right:1px solid var(--border);padding:24px 16px;display:flex;flex-direction:column;}
  .sidebar h2{font-size:22px;margin-bottom:6px;}
  .sidebar .sub{font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.55;margin-bottom:24px;}
  .nav button{display:block;width:100%;text-align:left;background:none;border:none;padding:11px 14px;border-radius:10px;font-size:14px;color:var(--ink);margin-bottom:4px;}
  .nav button:hover{background:#fff5ea;}
  .nav button.active{background:var(--peach);font-weight:600;}
  .sidebar .footer{margin-top:auto;font-size:12px;opacity:.6;padding-top:16px;border-top:1px solid var(--border);}
  .sidebar .footer button{background:none;border:none;color:var(--ink);font-size:12px;text-decoration:underline;padding:6px 0;}

  .main{padding:32px 40px 60px;max-width:980px;}
  .main h1{font-size:38px;margin-bottom:6px;}
  .main .desc{opacity:.6;font-size:13px;margin-bottom:30px;}

  /* Save bar */
  .savebar{position:sticky;top:0;background:var(--bg);padding:14px 0 18px;display:flex;justify-content:space-between;align-items:center;z-index:5;border-bottom:1px solid var(--border);margin-bottom:24px;}
  .savebar .status{font-size:13px;opacity:.7;}
  .savebar .status.dirty{color:#b8770f;font-weight:600;opacity:1;}
  .savebar .status.saved{color:#3b7a3b;}
  .savebar .status.error{color:#b53030;}
  .btn{display:inline-flex;align-items:center;justify-content:center;background:var(--ink);color:#fff;border:none;padding:10px 22px;border-radius:80px;font-size:14px;font-weight:500;}
  .btn:hover{background:#000;}
  .btn:disabled{background:#bbb;cursor:not-allowed;}
  .btn-peach{background:var(--peach);color:var(--ink);}
  .btn-peach:hover{background:var(--peach-deep);}
  .btn-outline{background:#fff;color:var(--ink);border:1px solid var(--border);}
  .btn-outline:hover{background:#fff5ea;}
  .btn-danger{background:#fff;color:#b53030;border:1px solid #f3d2d2;}
  .btn-danger:hover{background:#fdf0f0;}

  /* Forms */
  .field{margin-bottom:16px;display:block;}
  .field label{display:block;font-size:12px;letter-spacing:.13em;text-transform:uppercase;margin-bottom:6px;opacity:.7;font-weight:600;}
  .field input, .field textarea, .field select{width:100%;font:inherit;border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:#fff;}
  .field input:focus, .field textarea:focus{outline:none;border-color:var(--peach-deep);box-shadow:0 0 0 3px rgba(255,167,105,.18);}
  .field textarea{min-height:90px;resize:vertical;}
  .field .hint{font-size:12px;opacity:.55;margin-top:4px;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  @media (max-width:700px){.grid-2,.grid-3{grid-template-columns:1fr;}}

  /* Cards */
  .card{background:#fff;border-radius:18px;padding:22px;margin-bottom:14px;border:1px solid var(--border);}
  .card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;cursor:pointer;}
  .card-head h3{font-size:20px;flex:1;}
  .card-head .meta{font-size:12px;opacity:.6;margin-right:14px;}
  .card-head .toggle{font-size:18px;opacity:.5;width:24px;text-align:center;}
  .card-body{border-top:1px solid var(--border);padding-top:18px;}
  .card-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}

  /* Image picker */
  .imgpicker{display:flex;gap:14px;align-items:flex-start;}
  .imgpicker .preview{width:140px;height:140px;border-radius:12px;background:#fff5ea center/cover no-repeat;border:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:11px;text-align:center;}
  .imgpicker .actions{flex:1;display:flex;flex-direction:column;gap:8px;}
  .imgpicker input[type=file]{display:none;}
  .imgpicker label.file{display:inline-flex;justify-content:center;align-items:center;padding:8px 16px;border:1px dashed var(--border);border-radius:10px;cursor:pointer;font-size:13px;background:#fff;}
  .imgpicker label.file:hover{background:#fff5ea;}
  .imgpicker .url{font-size:12px;font-family:ui-monospace,monospace;background:#faf5ef;padding:6px 8px;border-radius:6px;word-break:break-all;}

  /* Per-event permalink row */
  .linkrow{display:flex;gap:8px;align-items:center;}
  .linkrow-input{flex:1;font-family:ui-monospace,monospace;font-size:13px;background:#faf5ef;}
  .linkrow .btn{white-space:nowrap;}

  /* Gallery grid */
  .gallery-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  @media (max-width:900px){.gallery-grid{grid-template-columns:repeat(3,1fr);}}
  @media (max-width:600px){.gallery-grid{grid-template-columns:repeat(2,1fr);}}
  .gallery-tile{aspect-ratio:1;background:#fff5ea center/cover no-repeat;border-radius:12px;border:1px solid var(--border);position:relative;overflow:hidden;}
  .gallery-tile .x{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;border:none;font-size:16px;line-height:1;}
  .gallery-tile .add{display:flex;align-items:center;justify-content:center;height:100%;font-size:32px;color:#bbb;cursor:pointer;}

  /* Setup screen */
  .setup{max-width:560px;margin:80px auto;padding:40px;background:#fff;border-radius:20px;border:1px solid var(--border);}
  .setup h1{font-family:'Cormorant Garamond',serif;font-size:42px;margin-bottom:10px;}
  .setup p{font-size:14px;line-height:1.6;margin-bottom:14px;}
  .setup ol{padding-left:18px;line-height:1.8;font-size:14px;margin-bottom:18px;}
  .setup code{background:#faf5ef;padding:2px 6px;border-radius:4px;font-size:13px;}
  .setup .alert{background:#fef6e7;padding:14px 16px;border-radius:10px;font-size:13px;line-height:1.5;margin-bottom:16px;border:1px solid #f5dca1;}

  .toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:14px 20px;border-radius:12px;font-size:13px;box-shadow:0 8px 28px rgba(0,0,0,.18);z-index:50;}
  .toast.error{background:#b53030;}
  .toast.success{background:#3b7a3b;}

  .empty{padding:40px;text-align:center;color:#999;background:#fff;border-radius:18px;border:1px dashed var(--border);}
  .spinner{display:inline-block;width:16px;height:16px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Payments / orders */
  .ord-sum{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:13px;margin-bottom:20px;}
  .ord-badge{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;}
  .ord-ok{background:#e8f5e9;color:#2e6b32;}
  .ord-warn{background:#fdecec;color:#b53030;}
  .ord-spots{background:#eef0fb;color:#3a3a7a;}
  .ord-soft{background:#f3f3f3;color:#555;}
  .ord-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px;}
  .ord-table th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.55;padding:6px 8px;border-bottom:1px solid var(--border);}
  .ord-table td{padding:7px 8px;border-bottom:1px solid #f3ece3;vertical-align:top;}
  .ord-flag{background:#fdf3e7;border:1px solid #f5dca1;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px;line-height:1.5;}
  .ord-dup{color:#b8770f;font-weight:600;}
  .ord-grouphead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  .ord-table td.num, .ord-table th.num{text-align:right;white-space:nowrap;}
  /* segmented toggle */
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;margin:6px 0 16px;}
  .seg button{background:#fff;border:none;padding:8px 18px;font-size:13px;color:var(--ink);}
  .seg button.active{background:var(--peach);font-weight:600;}
  .seat-row{cursor:pointer;}
  .seat-row:hover{background:#fff8f1;}
  .seat-detail td{background:#fffaf4;}
  /* clients stats */
  .stat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:8px;}
  @media (max-width:760px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
  .stat{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center;}
  .stat-n{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;line-height:1;}
  .stat-l{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.55;margin-top:6px;}
  .chips{display:flex;gap:8px;flex-wrap:wrap;}
  .cl-search{width:100%;max-width:360px;font:inherit;border:1px solid var(--border);border-radius:10px;padding:9px 12px;background:#fff;margin-bottom:12px;}
  .cl-search:focus{outline:none;border-color:var(--peach-deep);box-shadow:0 0 0 3px rgba(255,167,105,.18);}
  .off-input{width:60px;text-align:right;font:inherit;border:1px solid var(--border);border-radius:8px;padding:4px 6px;background:#fff;}
  .off-input:focus{outline:none;border-color:var(--peach-deep);box-shadow:0 0 0 2px rgba(255,167,105,.18);}
  .off-add{font:inherit;font-size:13px;border:1px solid var(--border);border-radius:8px;padding:6px 9px;background:#fff;min-width:130px;}
  .off-add:focus{outline:none;border-color:var(--peach-deep);box-shadow:0 0 0 2px rgba(255,167,105,.18);}
  .pager{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:13px;}
  .pager button{background:#fff;border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:13px;}
  .pager button:disabled{opacity:.4;cursor:not-allowed;}
</style>
</head>
<body>
<div id="app">

<!-- LOGIN -->
<div v-if="!authed && !checkingAuth" class="setup" style="max-width:420px;">
  <h1>Shuhai Admin</h1>
  <p style="margin-top:8px;margin-bottom:28px;opacity:.6;font-size:13px;">Sign in to manage your site.</p>
  <form @submit.prevent="login">
    <div class="field">
      <label>Password</label>
      <input v-model="passwordInput" type="password" autocomplete="current-password" autofocus>
    </div>
    <button class="btn" type="submit" :disabled="!passwordInput || loggingIn" style="width:100%;">
      <span v-if="loggingIn" class="spinner"></span>
      <span v-else>Sign in</span>
    </button>
  </form>
  <div v-if="loginError" style="color:#b53030;margin-top:14px;font-size:13px;">{{ loginError }}</div>
</div>

<!-- MAIN APP -->
<div v-else-if="authed && loaded" class="app">
  <aside class="sidebar">
    <h2>Shuhai</h2>
    <div class="sub">Admin</div>
    <nav class="nav">
      <button :class="{active:tab==='events'}" @click="tab='events'">Upcoming events</button>
      <button :class="{active:tab==='regular'}" @click="tab='regular'">Regular classes</button>
      <button :class="{active:tab==='gallery'}" @click="tab='gallery'">Gallery</button>
      <button :class="{active:tab==='text'}" @click="tab='text'">Site text</button>
      <button :class="{active:tab==='orders'}" @click="tab='orders'">Payments</button>
      <button :class="{active:tab==='clients'}" @click="tab='clients'">Clients</button>
      <button :class="{active:tab==='broadcast'}" @click="tab='broadcast'">Broadcast</button>
    </nav>
    <div class="footer">
      <button @click="reload">Reload from GitHub</button>
      <button @click="logout">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <div class="savebar">
      <div>
        <h1 style="font-size:30px;">{{ tabTitle }}</h1>
        <div class="status" :class="statusClass">{{ statusText }}</div>
      </div>
      <button v-if="tab==='orders' && !dirty" class="btn btn-outline" @click="loadOrders" :disabled="ordersLoading">
        <span v-if="ordersLoading" class="spinner" style="border-color:var(--ink);border-top-color:transparent;"></span>
        <span v-else>Refresh</span>
      </button>
      <button v-else-if="tab==='clients'" class="btn btn-outline" @click="loadClients" :disabled="clientsLoading">
        <span v-if="clientsLoading" class="spinner" style="border-color:var(--ink);border-top-color:transparent;"></span>
        <span v-else>Refresh</span>
      </button>
      <button v-else-if="tab==='broadcast'" class="btn btn-outline" @click="loadAudience" :disabled="audienceLoading">
        <span v-if="audienceLoading" class="spinner" style="border-color:var(--ink);border-top-color:transparent;"></span>
        <span v-else>Refresh</span>
      </button>
      <button v-else class="btn btn-peach" @click="save" :disabled="!dirty || saving">
        <span v-if="saving" class="spinner" style="border-color:var(--ink);border-top-color:transparent;"></span>
        <span v-else>Save &amp; publish</span>
      </button>
    </div>

    <!-- EVENTS / REGULAR shared component -->
    <template v-if="tab==='events' || tab==='regular'">
      <div v-if="currentList.length===0" class="empty">
        Nothing here yet. Click <strong>Add</strong> below to create one.
      </div>
      <div v-for="(ev, idx) in currentList" :key="ev.id" class="card">
        <div class="card-head" @click="toggleOpen(ev.id)">
          <h3>{{ ev.eventName || '(untitled)' }}</h3>
          <div class="meta">{{ ev.date && ev.date !== '%' ? ev.date : (ev.day || '') }} · ${{ ev.price }}</div>
          <div class="toggle">{{ openMap[ev.id] ? '▾' : '▸' }}</div>
        </div>
        <div v-show="openMap[ev.id]" class="card-body">
          <div class="field">
            <label>Title</label>
            <input v-model="ev.eventName" @input="markDirty">
          </div>
          <div class="field">
            <label>Direct link to this {{ tab==='events' ? 'event' : 'class' }}</label>
            <div class="linkrow">
              <input class="linkrow-input" :value="itemLink(ev)" readonly @focus="$event.target.select()">
              <button class="btn btn-outline" @click="copyItemLink(ev)">{{ copiedLinkId === ev.id ? 'Copied ✓' : 'Copy' }}</button>
            </div>
            <div class="hint">Share it in ads, Instagram or emails — it opens the site with this class already open for booking. The link is built from the title (and the date, if two classes share a title), so it changes when you rename the class.</div>
          </div>
          <div class="grid-3">
            <div class="field" v-if="tab==='events'">
              <label>Date (YYYY-MM-DD)</label>
              <input v-model="ev.date" @input="markDirty" placeholder="2026-06-01">
              <div class="hint">Use % for recurring</div>
            </div>
            <div class="field" v-if="tab==='regular'">
              <label>Date</label>
              <input v-model="ev.date" @input="markDirty" placeholder="% (recurring)">
            </div>
            <div class="field">
              <label>Day (optional)</label>
              <input v-model="ev.day" @input="markDirty" placeholder="Monday, Saturday...">
            </div>
            <div class="field">
              <label>Time</label>
              <input v-model="ev.time" @input="markDirty" placeholder="6:00 pm - 9:00 pm">
            </div>
          </div>
          <div class="grid-2">
            <div class="field">
              <label>Price (CAD, before GST)</label>
              <input type="number" step="0.01" v-model.number="ev.price" @input="markDirty">
            </div>
            <div class="field">
              <label>Start prefix (optional)</label>
              <input v-model="ev.startDate" @input="markDirty" placeholder="e.g. 'June 1 -' for multi-week">
            </div>
          </div>
          <div class="field">
            <label>Location</label>
            <input v-model="ev.location" @input="markDirty">
          </div>
          <div class="field">
            <label>Short description (shown on card)</label>
            <input v-model="ev.description" @input="markDirty">
          </div>
          <div class="field">
            <label>Full description (shown in popup)</label>
            <textarea v-model="ev.modalDescription" @input="markDirty"></textarea>
          </div>
          <div class="grid-2">
            <div class="field">
              <label>What's included (popup, optional)</label>
              <input v-model="ev.modalIncludes" @input="markDirty" placeholder="e.g. lunch, materials...">
            </div>
            <div class="field">
              <label>Discount note (popup, optional)</label>
              <input v-model="ev.modalDiscount" @input="markDirty" placeholder="e.g. for four classes">
            </div>
          </div>
          <div class="grid-2">
            <div class="field">
              <label>Max attendees (leave empty for default 12)</label>
              <input type="number" min="1" v-model.number="ev.maxAttendees" @input="markDirty" placeholder="12">
            </div>
            <div class="field">
              <label>Booked offline (cash / Etransfer / phone)</label>
              <input type="number" min="0" v-model.number="ev.bookedOffline" @input="markDirty" placeholder="0">
            </div>
          </div>
          <div class="field">
            <label>Card image</label>
            <div class="imgpicker">
              <div class="preview" :style="ev.img ? `background-image:url('${imgUrl(ev.img)}')` : ''">
                <span v-if="!ev.img">no image</span>
              </div>
              <div class="actions">
                <label class="file">
                  <input type="file" accept="image/*" @change="handleUpload($event, ev, 'img')">
                  Upload new image
                </label>
                <input v-model="ev.img" @input="markDirty" placeholder="filename.png or full URL">
                <div class="url" v-if="ev.img">{{ canonicalImgUrl(ev.img) }}</div>
                <div class="hint">Use a filename if the image lives in <code>public/assets/img/</code>, or a full URL.</div>
              </div>
            </div>
          </div>

          <div class="card-actions">
            <button class="btn-outline btn" @click="moveUp(idx)" :disabled="idx===0">↑ Move up</button>
            <button class="btn-outline btn" @click="moveDown(idx)" :disabled="idx===currentList.length-1">↓ Move down</button>
            <button class="btn-danger btn" @click="removeItem(idx)">Delete</button>
          </div>
        </div>
      </div>
      <div style="text-align:center;margin-top:24px;">
        <button class="btn" @click="addItem">+ Add new {{ tab==='events' ? 'event' : 'class' }}</button>
      </div>
    </template>

    <!-- GALLERY -->
    <template v-if="tab==='gallery'">
      <div class="card">
        <h3 style="font-size:22px;margin-bottom:14px;">Student artwork</h3>
        <div class="gallery-grid">
          <div v-for="(img, i) in content.gallery.student" :key="'s'+i"
               class="gallery-tile" :style="`background-image:url('${imgUrl(img)}')`">
            <button class="x" @click="removeGalleryImg('student', i)" title="Delete">×</button>
          </div>
          <label class="gallery-tile" style="cursor:pointer;">
            <input type="file" accept="image/*" style="display:none;" @change="handleGalleryUpload($event, 'student')">
            <div class="add">+</div>
          </label>
        </div>
      </div>
      <div class="card">
        <h3 style="font-size:22px;margin-bottom:14px;">My artwork</h3>
        <div class="gallery-grid">
          <div v-for="(img, i) in content.gallery.my" :key="'m'+i"
               class="gallery-tile" :style="`background-image:url('${imgUrl(img)}')`">
            <button class="x" @click="removeGalleryImg('my', i)" title="Delete">×</button>
          </div>
          <label class="gallery-tile" style="cursor:pointer;">
            <input type="file" accept="image/*" style="display:none;" @change="handleGalleryUpload($event, 'my')">
            <div class="add">+</div>
          </label>
        </div>
      </div>
    </template>

    <!-- SITE TEXT -->
    <template v-if="tab==='text'">
      <div class="card">
        <h3 style="font-size:22px;margin-bottom:14px;">Banner</h3>
        <div class="field">
          <label>Quote (top banner)</label>
          <textarea v-model="content.siteText.bannerQuote" @input="markDirty"></textarea>
        </div>
        <div class="field">
          <label>Quote author</label>
          <input v-model="content.siteText.bannerAuthor" @input="markDirty">
        </div>
      </div>

      <div class="card">
        <h3 style="font-size:22px;margin-bottom:14px;">"Why" section</h3>
        <div class="field">
          <label>Section title</label>
          <input v-model="content.siteText.whyTitle" @input="markDirty">
        </div>
        <div class="grid-2">
          <div>
            <div class="field"><label>Left card title</label><input v-model="content.siteText.whyLeftTitle" @input="markDirty"></div>
            <div class="field">
              <label>Left card items (one per line)</label>
              <textarea v-model="whyLeftItemsText" @input="markDirty"></textarea>
            </div>
          </div>
          <div>
            <div class="field"><label>Right card title</label><input v-model="content.siteText.whyRightTitle" @input="markDirty"></div>
            <div class="field">
              <label>Right card items (one per line)</label>
              <textarea v-model="whyRightItemsText" @input="markDirty"></textarea>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <h3 style="font-size:22px;margin-bottom:14px;">About me</h3>
        <div class="field"><label>Section title</label><input v-model="content.siteText.aboutTitle" @input="markDirty"></div>
        <div class="field">
          <label>Paragraphs (separate with a blank line)</label>
          <textarea v-model="aboutParagraphsText" @input="markDirty" style="min-height:200px;"></textarea>
        </div>
      </div>

      <div class="card">

<script type="module">
import { createApp, ref, reactive, computed, watch, onMounted } from 'vue';

const api = async (method, path, opts = {}) => {
  const init = { method, credentials: 'same-origin' };
  if (opts.json !== undefined) {
    init.headers = { 'Content-Type': 'application/json', 'Accept': 'application/json' };
    init.body = JSON.stringify(opts.json);
  } else if (opts.form) {
    init.body = opts.form;
  } else {
    init.headers = { 'Accept': 'application/json' };
  }
  const r = await fetch(path, init);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `Request ${r.status}`);
  return data;
};

createApp({
  setup() {
    const passwordInput = ref('');
    const authed = ref(false);
    const checkingAuth = ref(true);
    const loggingIn = ref(false);
    const loginError = ref('');

    const loaded = ref(false);
    const loadError = ref('');
    const content = ref(null);
    const sha = ref(null);
    const dirty = ref(false);
    const saving = ref(false);
    const status = ref({ type: 'idle', msg: '' });
    const toast = ref(null);
    const tab = ref('events');
    const openMap = reactive({});
    // Payments tab (read-only, lazy-loaded)
    const ordersData = ref(null);
    const ordersLoading = ref(false);
    const ordersError = ref('');
    const bookingsView = ref('upcoming');
    const expanded = reactive({});
    const offlineForms = reactive({}); // per-event { name, email, phone } add-form state
    // Clients tab (read-only, lazy-loaded)
    const clientsData = ref(null);
    const clientsLoading = ref(false);
    const clientsError = ref('');
    const clientSearch = ref('');
    const clientFilter = ref('all');
    const clientPage = ref(1);
    const CLIENTS_PER_PAGE = 25;
    // Broadcast tab (draft mode)
    const audienceData = ref(null);
    const audienceLoading = ref(false);
    const audienceError = ref('');
    const bcFilter = ref('all');
    const bcPage = ref(1);
    const copied = ref(false);
    const copiedLinkId = ref(null); // per-event "copy link" feedback
    const bcTestEmail = ref('');
    const bcSending = ref(''); // '' | 'test' | 'bulk'
    const bcResult = ref(null); // { error:bool, msg }
    const BC_PER_PAGE = 25;
    const CASL_FOOTER = '— Alevtyna, Shuhai Art Studio\n\n1324 11 Ave SW #202, Calgary · a.art.shuhai@gmail.com\nYou are receiving this because you took a class or subscribed at art-shuhai.com. Unsubscribe (one-click link in the email).';
    const bcSubject = ref('New painting workshops at Shuhai Art Studio');
    const bcBody = ref('Hi {name},\n\nIt’s Alevtyna from Shuhai Art Studio. I’d love to see you back at the easel — we have new beginner-friendly painting workshops coming up in Calgary, all materials included.\n\nSee the schedule and reserve your spot: https://art-shuhai.com/#events\n\nHope to paint with you soon!');
    // After a fresh upload the file is committed to GitHub but not yet served by Railway
    // (autodeploy takes a few minutes). Keep a local data-URL preview keyed by the canonical
    // path so the card thumbnail shows the new image immediately instead of a broken icon.
    const pendingPreviews = reactive({});

    const showToast = (msg, type = 'info', ms = 3000) => {
      toast.value = { msg, type };
      setTimeout(() => { toast.value = null; }, ms);
    };

    const tabTitle = computed(() => ({
      events: 'Upcoming events',
      regular: 'Regular classes',
      gallery: 'Gallery',
      text: 'Site text',
      orders: 'Payments',
      clients: 'Clients',
      broadcast: 'Broadcast',
    }[tab.value]));

    const currentList = computed(() =>
      tab.value === 'events' ? content.value?.events ?? [] :
      tab.value === 'regular' ? content.value?.regularClasses ?? [] : []
    );

    const statusText = computed(() => {
      if (tab.value === 'orders' || tab.value === 'clients' || tab.value === 'broadcast') return '';
      if (saving.value) return 'Saving…';
      if (status.value.type === 'error') return status.value.msg;
      if (status.value.type === 'saved') return 'Saved and published. Your changes will appear on the site in 3–4 minutes.';
      if (dirty.value) return 'Unsaved changes';
      return 'All changes saved';
    });
    const statusClass = computed(() => {
      if (status.value.type === 'error') return 'error';
      if (status.value.type === 'saved') return 'saved';
      if (dirty.value) return 'dirty';
      return '';
    });

    const markDirty = () => { dirty.value = true; status.value = { type: 'idle' }; };

    // Edit offline (cash / e-transfer) booking count for an event straight from the
    // seats table. Writes to the same content.json field the events editor uses;
    // takes effect on the public site after Save & publish.
    function setOffline(id, val) {
      const ev = (content.value?.events || []).find(e => e.id === id);
      if (!ev) return;
      const named = Array.isArray(ev.offlineBookings) ? ev.offlineBookings.length : 0;
      const n = Math.max(named, parseInt(val, 10) || 0); // never below the named count
      if (ev.bookedOffline === n) return;
      ev.bookedOffline = n;
      markDirty();
    }

    // Named offline bookings (cash / e-transfer) kept in content.json per event.
    function getOfflineForm(id) {
      if (!offlineForms[id]) offlineForms[id] = { name: '', email: '', phone: '' };
      return offlineForms[id];
    }
    function addOffline(id) {
      const f = offlineForms[id];
      if (!f || !String(f.name).trim()) return;
      const ev = (content.value?.events || []).find(e => e.id === id);
      if (!ev) return;
      if (!Array.isArray(ev.offlineBookings)) ev.offlineBookings = [];
      ev.offlineBookings.push({
        name: String(f.name).trim(),
        email: String(f.email || '').trim(),
        phone: String(f.phone || '').trim(),
        date: todayStr(),
      });
      if (ev.offlineBookings.length > (Number(ev.bookedOffline) || 0)) ev.bookedOffline = ev.offlineBookings.length;
      offlineForms[id] = { name: '', email: '', phone: '' };
      markDirty();
    }
    function removeOffline(id, idx) {
      const ev = (content.value?.events || []).find(e => e.id === id);
      if (!ev || !Array.isArray(ev.offlineBookings)) return;
      ev.offlineBookings.splice(idx, 1);
      ev.bookedOffline = Math.max(ev.offlineBookings.length, (Number(ev.bookedOffline) || 1) - 1);
      markDirty();
    }

    // Derived text fields
    const whyLeftItemsText = computed({
      get: () => content.value?.siteText.whyLeftItems.join('\n') || '',
      set: v => { content.value.siteText.whyLeftItems = v.split('\n').filter(x => x.trim()); markDirty(); }
    });
    const whyRightItemsText = computed({
      get: () => content.value?.siteText.whyRightItems.join('\n') || '',
      set: v => { content.value.siteText.whyRightItems = v.split('\n').filter(x => x.trim()); markDirty(); }
    });
    const aboutParagraphsText = computed({
      get: () => content.value?.siteText.aboutParagraphs.join('\n\n') || '',
      set: v => { content.value.siteText.aboutParagraphs = v.split(/\n\s*\n/).map(s => s.trim()).filter(Boolean); markDirty(); }
    });

    // ---- payments / orders (read-only) ----
    async function loadOrders() {
      ordersLoading.value = true;
      ordersError.value = '';
      try {
        ordersData.value = await api('GET', '/cms/orders');
      } catch (e) {
        ordersError.value = e.message;
      } finally {
        ordersLoading.value = false;
      }
    }

    function fmtTime(iso) {
      try { return new Date(iso).toLocaleString(); } catch { return iso; }
    }

    function dupEmail(orders, email) {
      if (!email) return false;
      const e = String(email).toLowerCase().trim();
      return orders.filter(o => String(o.email || '').toLowerCase().trim() === e).length > 1;
    }

    function spotsLeft(g) {
      const max = ordersData.value?.max ?? 12;
      return Math.max(0, max - (g.site_count || 0));
    }

    // Join the backend's paid groups (keyed by event_id+name) against the current
    // content so the operator sees their live classes first, with stray/old rows after.
    // Match each dated event to its reconciled group. Primary match is (event_id +
    // exact name). If a class was renamed (typo fix), its old bookings keep the old
    // name; with no exact match we adopt the single real (db_count>0) "orphan" group on
    // the same event id (same class, former name). Past classes that reused an id live
    // only in Stripe history (db_count 0) and are never adopted, so collisions stay apart.
    const matchedGroups = computed(() => {
      const data = ordersData.value;
      const events = content.value?.events || [];
      const keyOf = (id, name) => String(id) + '␟' + String(name);
      const byId = new Map();
      const usedKeys = new Set();
      if (!data) return { byId, usedKeys, keyOf };
      const groups = data.groups || [];
      const gmap = new Map(groups.map(g => [keyOf(g.event_id, g.event_name), g]));
      const exactKeys = new Set();
      for (const ev of events) {
        const k = keyOf(ev.id, ev.eventName);
        if (gmap.has(k)) exactKeys.add(k);
      }
      for (const ev of events) {
        const k = keyOf(ev.id, ev.eventName);
        let g = gmap.get(k) || null;
        if (g) {
          usedKeys.add(k);
        } else {
          const orphans = groups.filter(x =>
            String(x.event_id) === String(ev.id) &&
            x.db_count > 0 &&
            !exactKeys.has(keyOf(x.event_id, x.event_name))
          );
          if (orphans.length === 1) {
            g = orphans[0];
            usedKeys.add(keyOf(g.event_id, g.event_name));
          }
        }
        byId.set(ev.id, g);
      }
      return { byId, usedKeys, keyOf };
    });

    const ordersView = computed(() => {
      const data = ordersData.value;
      if (!data) return { current: [], stray: [] };
      const SEP = '\u0000';
      const current = [];
      // Reconcile only dated upcoming events — that's where "spots left" and the
      // DB/Stripe match are meaningful. Recurring "regular classes" have no fixed
      // capacity and accumulate orders over a long time, so flagging them as
      // mismatches would be noise.
      const mg = matchedGroups.value;
      for (const ev of (content.value?.events || [])) {
        const g = mg.byId.get(ev.id);
        if (g) { current.push(g); }
        else {
          current.push({
            event_id: String(ev.id),
            event_name: ev.eventName,
            event_date: ev.date && ev.date !== '%' ? ev.date : (ev.day || ''),
            orders: [], db_count: 0,
            site_count: (data.site_paid_by_id && data.site_paid_by_id[String(ev.id)]) || 0,
            stripe_count: data.stripe_ok ? 0 : null,
            stripe_only: [], db_only: [], waitlist: 0, mismatch: false,
          });
        }
      }
      // Only rows that actually exist in the database (db_count > 0) and don't match a
      // current event. Excludes the long tail of past classes that live only in Stripe
      // history (db_count 0) — those aren't "in the database" and aren't actionable here.
      const stray = (data.groups || []).filter(g => g.db_count > 0 && !mg.usedKeys.has(mg.keyOf(g.event_id, g.event_name)));
      return { current, stray };
    });

    function toggleRow(id) { expanded[id] = !expanded[id]; }

    function todayStr() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    // Seats table rows: join each dated event with its reconciled Stripe group and the
    // capacity / offline fields from content. "Spots left" uses real Stripe payments;
    // siteLeft is what the public badge currently shows (so we can flag drift).
    const bookingRows = computed(() => {
      const data = ordersData.value;
      const events = content.value?.events || [];
      if (!data || !events.length) return { upcoming: [], past: [] };
      const SEP = '\u0000';
      const mg = matchedGroups.value;
      const today = todayStr();
      const rows = events.map(ev => {
        const g = mg.byId.get(ev.id) || null;
        const cap = Number(ev.maxAttendees) > 0 ? Number(ev.maxAttendees) : (data.max || 12);
        const offline = Number(ev.bookedOffline) > 0 ? Number(ev.bookedOffline) : 0;
        const stripe = g ? (g.stripe_count != null ? g.stripe_count : g.db_count) : 0;
        const siteCount = g ? g.site_count : ((data.site_paid_by_id && data.site_paid_by_id[String(ev.id)]) || 0);
        return {
          id: ev.id,
          name: ev.eventName,
          date: ev.date,
          cap,
          stripe,
          offline,
          left: Math.max(0, cap - stripe - offline),
          siteLeft: Math.max(0, cap - siteCount - offline),
          stripe_only: g ? g.stripe_only : [],
          orders: g ? g.orders : [],
          offlineList: Array.isArray(ev.offlineBookings) ? ev.offlineBookings : [],
          isPast: ev.date && ev.date !== '%' && ev.date < today,
        };
      });
      return {
        upcoming: rows.filter(r => !r.isPast),
        past: rows.filter(r => r.isPast),
      };
    });

    const activeBookingRows = computed(() =>
      bookingsView.value === 'past' ? bookingRows.value.past : bookingRows.value.upcoming
    );

    // ---- clients (read-only) ----
    async function loadClients() {
      clientsLoading.value = true;
      clientsError.value = '';
      try {
        clientsData.value = await api('GET', '/cms/clients');
      } catch (e) {
        clientsError.value = e.message;
      } finally {
        clientsLoading.value = false;
      }
    }

    function fmtMoney(n) {
      const v = Number(n) || 0;
      return v.toLocaleString('en-CA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    const filteredClients = computed(() => {
      const data = clientsData.value;
      if (!data) return [];
      let list = data.clients;
      if (clientFilter.value === 'repeat') list = list.filter(c => c.orders > 1);
      else if (clientFilter.value === 'new') {
        const ym = todayStr().slice(0, 7);
        list = list.filter(c => String(c.first || '').slice(0, 7) === ym);
      }
      const q = clientSearch.value.trim().toLowerCase();
      if (q) list = list.filter(c =>
        String(c.name || '').toLowerCase().includes(q) ||
        String(c.email || '').toLowerCase().includes(q)
      );
      return list;
    });

    const clientPages = computed(() => Math.max(1, Math.ceil(filteredClients.value.length / CLIENTS_PER_PAGE)));
    const pagedClients = computed(() => {
      const start = (clientPage.value - 1) * CLIENTS_PER_PAGE;
      return filteredClients.value.slice(start, start + CLIENTS_PER_PAGE);
    });

    watch([clientSearch, clientFilter], () => { clientPage.value = 1; });

    // ---- broadcast (draft mode, read-only audience) ----
    async function loadAudience() {
      audienceLoading.value = true;
      audienceError.value = '';
      try {
        audienceData.value = await api('GET', '/cms/audience');
      } catch (e) {
        audienceError.value = e.message;
      } finally {
        audienceLoading.value = false;
      }
    }

    const filteredRecipients = computed(() => {
      const d = audienceData.value;
      if (!d) return [];
      let list = d.recipients;
      if (bcFilter.value === 'subscriber') list = list.filter(r => r.source === 'subscriber' || r.source === 'both');
      else if (bcFilter.value === 'client') list = list.filter(r => r.source === 'client' || r.source === 'both');
      return list;
    });
    const bcPages = computed(() => Math.max(1, Math.ceil(filteredRecipients.value.length / BC_PER_PAGE)));
    const pagedRecipients = computed(() => {
      const start = (bcPage.value - 1) * BC_PER_PAGE;
      return filteredRecipients.value.slice(start, start + BC_PER_PAGE);
    });
    watch(bcFilter, () => { bcPage.value = 1; });

    const previewName = computed(() => {
      const r = filteredRecipients.value[0];
      const n = (r && r.name) ? String(r.name).trim().split(/\s+/)[0] : '';
      return n || 'there';
    });
    const previewBody = computed(() => (bcBody.value + '\n\n' + CASL_FOOTER).replace(/\{name\}/g, previewName.value));

    function csvCell(s) {
      s = String(s == null ? '' : s);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }
    function downloadRecipientsCsv() {
      const rows = [['name', 'email', 'source', 'last'], ...filteredRecipients.value.map(r => [r.name, r.email, r.source, r.last])];
      const csv = rows.map(r => r.map(csvCell).join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'shuhai-broadcast-recipients.csv';
      a.click();
      URL.revokeObjectURL(url);
    }
    async function copyEmail() {
      const text = 'Subject: ' + bcSubject.value + '\n\n' + bcBody.value + '\n\n' + CASL_FOOTER;
      try {
        await navigator.clipboard.writeText(text);
        copied.value = true;
        setTimeout(() => { copied.value = false; }, 1500);
      } catch (e) {
        showToast('Copy failed — select and copy manually', 'error', 4000);
      }
    }

    async function sendTest() {
      if (!bcTestEmail.value.trim()) return;
      bcSending.value = 'test';
      bcResult.value = null;
      try {
        const r = await api('POST', '/cms/broadcast/send', { json: {
          mode: 'test', subject: bcSubject.value, body: bcBody.value, test_email: bcTestEmail.value.trim(),
        }});
        bcResult.value = { error: false, msg: `Test sent to ${bcTestEmail.value.trim()} — check it (incl. the unsubscribe link).` };
      } catch (e) {
        bcResult.value = { error: true, msg: e.message };
      } finally {
        bcSending.value = '';
      }
    }

    async function sendBatch() {
      const n = Math.min(100, filteredRecipients.value.length);
      if (!confirm(`Send a real email now to up to ${n} people in this segment? (Already-emailed and unsubscribed are skipped.)`)) return;
      bcSending.value = 'bulk';
      bcResult.value = null;
      try {
        const recipients = filteredRecipients.value.map(r => ({ email: r.email, name: r.name }));
        const r = await api('POST', '/cms/broadcast/send', { json: {
          mode: 'bulk', subject: bcSubject.value, body: bcBody.value, recipients, limit: 100,
        }});
        const sent = r.sent || 0, remaining = r.remaining || 0;
        bcResult.value = { error: false, msg: sent > 0
          ? `Sent to ${sent}. ${remaining} left — come back tomorrow (free tier = 100/day) to send the rest.`
          : (r.message || 'Nobody left to send to.') };
      } catch (e) {
        bcResult.value = { error: true, msg: e.message };
      } finally {
        bcSending.value = '';
      }
    }

    watch(tab, (v) => {
      if (v === 'orders' && !ordersData.value && !ordersLoading.value) loadOrders();
      if (v === 'clients' && !clientsData.value && !clientsLoading.value) loadClients();
      if (v === 'broadcast' && !audienceData.value && !audienceLoading.value) loadAudience();
    });

    // ---- auth ----
    async function checkAuth() {
      try {
        const r = await api('GET', '/cms/status');
        authed.value = !!r.authed;
        if (authed.value) await loadContent();
      } catch {}
      checkingAuth.value = false;
    }

    async function login() {
      loggingIn.value = true;
      loginError.value = '';
      try {
        await api('POST', '/cms/login', { json: { password: passwordInput.value } });
        authed.value = true;
        passwordInput.value = '';
        await loadContent();
      } catch (e) {
        loginError.value = e.message;
      } finally {
        loggingIn.value = false;
      }
    }

    async function logout() {
      if (dirty.value && !confirm('You have unsaved changes. Sign out anyway?')) return;
      try { await api('POST', '/cms/logout'); } catch {}
      authed.value = false;
      content.value = null;
      loaded.value = false;
      sha.value = null;
      dirty.value = false;
    }

    // ---- load / save ----
    async function loadContent() {
      loaded.value = false;
      loadError.value = '';
      try {
        const r = await api('GET', '/cms/load');
        content.value = r.content;
        sha.value = r.sha;
        loaded.value = true;
      } catch (e) {
        loadError.value = e.message;
      }
    }

    async function reload() {
      if (dirty.value && !confirm('Discard unsaved changes and reload?')) return;
      await loadContent();
      dirty.value = false;
      status.value = { type: 'idle' };
    }

    async function save() {
      if (!dirty.value || saving.value) return;
      saving.value = true;
      try {
        const r = await api('POST', '/cms/save', { json: { content: content.value, sha: sha.value } });
        sha.value = r.sha;
        dirty.value = false;
        status.value = { type: 'saved' };
        showToast('Saved! Live in ~3 minutes.', 'success');
      } catch (e) {
        status.value = { type: 'error', msg: e.message };
        showToast(`Save failed: ${e.message}`, 'error', 6000);
      } finally {
        saving.value = false;
      }
    }

    // ---- image upload ----
    async function uploadImage(file) {
      const form = new FormData();
      form.append('image', file);
      const r = await api('POST', '/cms/upload', { form });
      return r.url.replace(/^\//, ''); // store without leading slash
    }

    async function handleUpload(event, target, key) {
      const file = event.target.files[0];
      if (!file) return;
      showToast('Uploading image…', 'info', 10000);
      // Read the file as a data URL up-front so we can show the new thumbnail the moment
      // the upload returns, even before Railway's autodeploy starts serving the path.
      const dataUrlPromise = readAsDataUrl(file).catch(() => null);
      try {
        const url = await uploadImage(file);
        target[key] = url;
        const dataUrl = await dataUrlPromise;
        if (dataUrl) pendingPreviews[url] = dataUrl;
        markDirty();
        showToast('Image uploaded. Click Save to publish.', 'success');
      } catch (e) {
        showToast(`Upload failed: ${e.message}`, 'error', 6000);
      } finally {
        event.target.value = '';
      }
    }

    async function handleGalleryUpload(event, which) {
      const file = event.target.files[0];
      if (!file) return;
      showToast('Uploading image…', 'info', 10000);
      const dataUrlPromise = readAsDataUrl(file).catch(() => null);
      try {
        const url = await uploadImage(file);
        content.value.gallery[which].push(url);
        const dataUrl = await dataUrlPromise;
        if (dataUrl) pendingPreviews[url] = dataUrl;
        markDirty();
        showToast('Image added. Click Save to publish.', 'success');
      } catch (e) {
        showToast(`Upload failed: ${e.message}`, 'error', 6000);
      } finally {
        event.target.value = '';
      }
    }

    function removeGalleryImg(which, i) {
      if (!confirm('Remove this image from the gallery? (The file itself stays in the repo.)')) return;
      content.value.gallery[which].splice(i, 1);
      markDirty();
    }

    // ---- list ops ----
    function addItem() {
      const list = tab.value === 'events' ? content.value.events : content.value.regularClasses;
      const ids = list.map(x => x.id);
      const next = (ids.length ? Math.max(...ids) : 0) + 1;
      const tmpl = tab.value === 'events'
        ? { id: next, eventName: 'NEW EVENT', startDate: null, date: '2026-01-01', time: '6:00 pm - 9:00 pm', day: null, price: 0, location: '1324 11 Ave SW, #202, Calgary', description: 'Beginner-friendly. All supplies provided', img: '', modalDescription: '', modalIncludes: null, modalDiscount: null }
        : { id: next, eventName: 'NEW CLASS', time: '6:00 pm - 9:00 pm', date: '%', day: 'Saturday', price: 0, location: '1324 11 Ave SW, #202, Calgary', description: 'All supplies provided', img: '', modalDescription: '', modalIncludes: null, modalDiscount: null };
      list.push(tmpl);
      openMap[next] = true;
      markDirty();
    }
    function removeItem(idx) {
      const list = tab.value === 'events' ? content.value.events : content.value.regularClasses;
      if (!confirm(`Delete "${list[idx].eventName}"?`)) return;
      list.splice(idx, 1);
      markDirty();
    }
    function moveUp(idx) {
      if (idx === 0) return;
      const list = tab.value === 'events' ? content.value.events : content.value.regularClasses;
      [list[idx - 1], list[idx]] = [list[idx], list[idx - 1]];
      markDirty();
    }
    function moveDown(idx) {
      const list = tab.value === 'events' ? content.value.events : content.value.regularClasses;
      if (idx === list.length - 1) return;
      [list[idx + 1], list[idx]] = [list[idx], list[idx + 1]];
      markDirty();
    }
    function toggleOpen(id) { openMap[id] = !openMap[id]; }
    function addFaq() { content.value.siteText.faq.push({ question: '', answer: '' }); markDirty(); }
    function removeFaq(i) { content.value.siteText.faq.splice(i, 1); markDirty(); }

    // ---- per-event permalinks (/event/{slug}) ----
    // Same rules as app/Support/EventLinks.php and resources/js/eventLinks.js:
    // slug = title; the date is added only when two classes share a title.
    function slugify(text) {
      return String(text == null ? '' : text)
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '');
    }
    function slugsFor(list) {
      const items = Array.isArray(list) ? list : [];
      const bases = items.map(item => slugify(item && item.eventName) || 'class');
      const counts = {};
      bases.forEach(base => { counts[base] = (counts[base] || 0) + 1; });
      const seen = {};
      return bases.map((base, i) => {
        const date = String((items[i] && items[i].date) || '');
        let slug = base;
        if (counts[base] > 1 && date !== '' && date !== '%') slug = `${base}-${slugify(date)}`;
        const n = (seen[slug] || 0) + 1;
        seen[slug] = n;
        return n > 1 ? `${slug}-${n}` : slug;
      });
    }
    function itemLink(ev) {
      const list = currentList.value;
      const i = list.indexOf(ev);
      const slug = i === -1 ? slugify(ev && ev.eventName) : slugsFor(list)[i];
      return `${location.origin}/event/${slug || 'class'}`;
    }
    async function copyItemLink(ev) {
      const link = itemLink(ev);
      try {
        await navigator.clipboard.writeText(link);
      } catch (e) {
        window.prompt('Copy this link:', link);
        return;
      }
      copiedLinkId.value = ev.id;
      setTimeout(() => { if (copiedLinkId.value === ev.id) copiedLinkId.value = null; }, 1500);
    }

    function canonicalImgUrl(img) {
      if (!img) return '';
      if (/^https?:\/\//.test(img)) return img;
      if (img.startsWith('assets/')) return `/${img}`;
      return `/assets/img/${img}`;
    }

    function imgUrl(img) {
      if (!img) return '';
      // Prefer the in-memory data URL while the autodeploy is still in flight.
      if (pendingPreviews[img]) return pendingPreviews[img];
      return canonicalImgUrl(img);
    }

    function readAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error || new Error('Could not read file'));
        reader.readAsDataURL(file);
      });
    }

    // warn on unload if dirty
    window.addEventListener('beforeunload', (e) => {
      if (dirty.value) { e.preventDefault(); e.returnValue = ''; }
    });

    onMounted(checkAuth);

    return {
      passwordInput, authed, checkingAuth, loggingIn, loginError, login, logout,
      loaded, loadError, content, dirty, saving, save, reload,
      tab, tabTitle, openMap, toggleOpen,
      currentList, addItem, removeItem, moveUp, moveDown,
      markDirty, statusText, statusClass,
      handleUpload, handleGalleryUpload, removeGalleryImg, imgUrl, canonicalImgUrl,
      itemLink, copyItemLink, copiedLinkId,
      whyLeftItemsText, whyRightItemsText, aboutParagraphsText,
      addFaq, removeFaq,
      toast,
      ordersData, ordersLoading, ordersError, ordersView, loadOrders, fmtTime, dupEmail, spotsLeft,
      bookingsView, bookingRows, activeBookingRows, expanded, toggleRow,
      clientsData, clientsLoading, clientsError, clientSearch, loadClients, filteredClients, fmtMoney,
      clientFilter, clientPage, pagedClients, clientPages, setOffline,
      getOfflineForm, addOffline, removeOffline,
      audienceData, audienceLoading, audienceError, loadAudience,
      bcSubject, bcBody, bcFilter, bcPage, copied,
      filteredRecipients, bcPages, pagedRecipients, previewName, previewBody,
      downloadRecipientsCsv, copyEmail,
      bcTestEmail, bcSending, bcResult, sendTest, sendBatch,
    };
  }
}).mount('#app');
</script>
</body>
